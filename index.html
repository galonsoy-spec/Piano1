<!DOCTYPE html>
<html 
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6d28d9">
<title>Piano Fácil</title>
<style>
:root{--sh:150px;--p:#6d28d9;--p2:#8b5cf6;--bg:#f5f3ff;--ink:#1e1b4b;--ok:#16a34a;--bad:#dc2626;--mut:#6b7280}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:600px;margin:0 auto;padding:14px 14px 70px}
h1{font-size:22px;margin:0}
h2{font-size:17px;margin:14px 0 2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;padding-right:52px}
.pill{background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;box-shadow:0 1px 3px #0001}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px #0001}
.lesson{display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:2px solid transparent;gap:8px}
.lesson:active{border-color:var(--p2)}
.lesson.lock{opacity:.5;cursor:default}
.lesson b{display:block;font-size:16px}
.lesson small{color:var(--mut)}
.stars{font-size:18px;letter-spacing:1px;color:#f59e0b;white-space:nowrap}
.stars .off{color:#d1d5db}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;background:var(--p);color:#fff;font-weight:600;cursor:pointer}
button.sec{background:#ede9fe;color:var(--p)}
button.on{background:var(--ok);color:#fff}
button.big2{width:100%;padding:14px;font-size:17px;margin-bottom:10px}
button:disabled{opacity:.5}
.fsb{position:fixed;right:10px;top:8px;width:40px;height:40px;border-radius:50%;padding:0;font-size:20px;z-index:20;box-shadow:0 2px 8px #0004}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.lvl{color:var(--mut);font-size:13px;margin:0 0 6px}
.staffbox{overflow-x:auto;scroll-behavior:smooth;background:#fffdf7;border:1px solid #e5e7eb;border-radius:12px;margin-bottom:8px}
.staffbox svg{display:block;height:var(--sh);width:auto}
.big{display:flex;align-items:baseline;justify-content:center;gap:10px;flex-wrap:wrap;margin:2px 0 6px}
.big .n{font-size:48px;font-weight:800;line-height:1;color:var(--p)}
.big .nm{font-size:24px;font-weight:700}
.big .msg{flex-basis:100%;text-align:center;min-height:18px;font-size:13px;color:var(--mut)}
.big .msg.bad{color:var(--bad)}
.big .msg.ok{color:var(--ok)}
.kb{position:relative;display:flex;height:125px;user-select:none;touch-action:manipulation;margin:6px 0 10px}
.w{flex:1;background:#fff;border:1px solid #9ca3af;border-radius:0 0 8px 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:6px;font-weight:700;font-size:15px;position:relative}
.w small{font-size:9px;color:var(--mut);font-weight:500}
.bk{position:absolute;top:0;width:6.4%;height:62%;background:#111827;border-radius:0 0 6px 6px;z-index:2}
.w.t2{background:#ede9fe}
.w.t,.bk.t{background:var(--p2);color:#fff;box-shadow:0 0 0 3px #c4b5fd inset}
.w.t small{color:#ede9fe}
.w.press,.bk.press{background:#fde68a}
.w.good,.bk.good{background:#86efac}
.w.err,.bk.err{background:#fca5a5}
.w.heard,.bk.heard{background:#93c5fd}
.sw{position:relative}
.sw:after{content:"";position:absolute;top:0;bottom:0;left:33.3%;width:2px;background:#c4b5fd;opacity:.8;pointer-events:none}
.hear{font-size:17px;font-weight:700;color:var(--p);text-align:center;min-height:24px;margin-bottom:4px}
.note{font-size:13px;color:var(--mut);line-height:1.4}
.info{font-size:14px;line-height:1.45;background:#f5f3ff;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.hide{display:none}
.res{text-align:center;position:fixed;left:10px;right:10px;bottom:10px;max-width:480px;margin:0 auto;z-index:30;box-shadow:0 8px 30px #0006}
.res .stars{font-size:40px}
.warn{background:#fef3c7;color:#92400e;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:8px}
.opt{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-top:10px}
.opt label{display:flex;align-items:center;gap:6px}
.card.main,.card.side{padding:10px}
.info{margin:6px 0 0}
details>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--p);padding:2px 0}
.side .row>button{flex:1 1 40%;padding:9px 6px;font-size:14px}
.side .opt{margin-top:8px}
@media (orientation:landscape) and (max-height:560px){
 :root{--sh:92px}
 .top button,.top .pill{padding:4px 10px;font-size:13px}
 .fsb{width:34px;height:34px;font-size:17px;top:6px}
 .top{padding-right:44px;margin-bottom:2px}
 .card.main{padding:6px 8px}
 .big{margin:0 0 2px}
 .big .msg{flex-basis:auto;min-height:0;font-size:12px}
 .staffbox{margin-bottom:2px}
 .wrap{max-width:none;padding:6px 10px 10px}
 .top{margin-bottom:4px}
 .cols{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:8px;align-items:start}
 .kb{margin:2px 0 2px}
 .card{margin-bottom:6px}
 .hear{font-size:14px;min-height:18px;margin-bottom:0}
 .big .n{font-size:36px}
 .big .nm{font-size:20px}
}
.playing,.playing body{overflow:hidden;height:100%}
.playing .wrap{height:100dvh;display:flex;flex-direction:column;padding:8px 10px}
.playing #play{flex:1;display:flex;flex-direction:column;min-height:0}
.playing .cols{flex:1;display:flex;flex-direction:column;min-height:0;gap:6px}
.playing .card{margin-bottom:0}
.playing .card.main{flex:1;display:flex;flex-direction:column;min-height:0}
.playing{--sh:min(44dvh,400px)}
.playing .kb{flex:none;height:96px;min-height:0;margin:4px 0 6px}
.playing .card.main{justify-content:flex-start}
.playing .info{max-height:22vh;overflow:auto}
.playing .staffbox{flex:none}
@media (orientation:landscape) and (max-height:560px){
 .playing .cols{display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:stretch}
 .playing{--sh:min(44dvh,150px)}
 .playing .kb{flex:none;height:27dvh;max-height:none}
}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;background:#ede9fe;color:var(--p);padding:9px 2px;font-size:13px;border-radius:12px}
.tab.act{background:var(--p);color:#fff}
.theory summary{font-size:15px;color:var(--ink);padding:4px 0}
.theory .tx{font-size:14px;line-height:1.5;margin-top:6px}
.fall{position:relative;height:var(--sh);background:#1e1b4b;border-radius:12px;margin-bottom:8px;overflow:hidden;background-image:linear-gradient(90deg,#3b3790 1px,transparent 1px);background-size:7.142857% 100%}
.fb{position:absolute;border-radius:7px;background:#8b5cf6;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;transition:bottom .35s ease,opacity .3s;border:1px solid #c4b5fd}
.fb.cur{background:#f59e0b;border-color:#fde68a}
.playing .fall{flex:none}
.meter{height:8px;background:#e5e7eb;border-radius:6px;overflow:hidden;margin:0 auto 6px;max-width:280px}
.meter i{display:block;height:100%;width:0;background:#9ca3af}
.meter i.on{background:var(--ok)}
</style>
</head>
<body>
<div class="wrap">

<div id="home">
  <div class="top"><h1>🎹 Piano Fácil</h1><div class="pill" id="stat"></div></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="curso">📚 Curso</button>
    <button class="tab" data-t="juegos">🎮 Juegos</button>
    <button class="tab" data-t="canciones">🎵 Canciones</button>
    <button class="tab" data-t="teoria">🎓 Teoría</button>
  </div>
  <div id="t_curso"><button class="big2" id="cont">▶ Continuar</button><div id="list"></div></div>
  <div id="t_juegos" class="hide"></div>
  <div id="t_canciones" class="hide"></div>
  <div id="t_teoria" class="hide"></div>
</div>

<div id="play" class="hide">
  <div class="top">
    <button class="sec" id="back">← Curso</button>
    <div class="pill" id="ttl"></div>
  </div>
  <div class="cols">
  <div class="card main">
    <details id="infoD"><summary>ℹ️ Explicación de la lección</summary><div class="info" id="info"></div></details>
    <div class="sw" id="sw"><div class="staffbox" id="staffbox"></div></div>
    <div class="fall hide" id="fall"></div>
    <div class="big"><span class="n" id="bn">–</span><span class="nm" id="bnm"></span><span class="msg" id="msg"></span></div>
    <div class="kb" id="kb"></div>
    <div class="hear" id="hear"></div>
    <div class="meter hide" id="meter"><i id="mi"></i></div>
  </div>
  <div class="card side">
    <div class="row">
      <button class="sec" id="mTap">👆 Pantalla</button>
      <button class="sec" id="mMic">🎤 Micrófono</button>
      <button class="sec" id="demo">🔊 Escuchar</button>
      <button class="sec" id="reset">↺ Reiniciar</button>
    </div>
    <div class="warn hide" id="warn" style="margin-top:8px"></div>
    <details style="margin-top:8px"><summary>⚙️ Opciones</summary>
    <div class="opt">
      <label><input type="checkbox" id="oLab"> Números bajo las notas</label>
      <label><input type="checkbox" id="oHint"> Marcar la tecla</label>
      <label><input type="checkbox" id="oFall"> Cascada de notas (en vez de partitura)</label>
      <label>Sensibilidad del micro <input type="range" id="oSens" min="1" max="15" step="1"></label>
    </div>
    <p class="note" style="margin:8px 0 0">Toca la nota resaltada. Vale cualquier octava: lo importante es el nombre de la nota. La app espera a que toques la correcta; la duración la ves en la partitura y la oyes con "Escuchar".</p>
    </details>
  </div>
  </div>
  <div class="card res hide" id="res"></div>
</div>

</div>

<button class="fsb" id="fs" aria-label="Pantalla completa">⛶</button>

function prep(l){

function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function genNotes(list,n){const o=[];let last=-1;for(let i=0;i<n;i++){let m=rnd(list);if(m===last)m=rnd(list);o.push(m);last=m}return o.join(' ')}
function genLeaps(n){
  let i=Math.floor(Math.random()*6),o=[WI[i]];
  while(o.length<n){
    const st=(Math.random()<.5?3:4)*(Math.random()<.5?-1:1);let j=i+st;
    if(j<0||j>=WI.length)j=i-st;
    if(j<0||j>=WI.length)continue;
    i=j;o.push(WI[i]);
  }
  return o.join(' ');
}

let stream=null,an=null,buf=null,timer=null,prevRms=0,cand=-1,stable=0,lastPc=-1,pend=0;
async function startMic(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('no');
    stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const c=ctx();try{await c.resume()}catch(e){}
    const src=c.createMediaStreamSource(stream);
    an=c.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=0;
    src.connect(an);
    /* algunos móviles no "tiran" del micrófono si el analizador no llega al destino: lo conectamos mudo */
    const mute=c.createGain();mute.gain.value=0;an.connect(mute);mute.connect(c.destination);
    buf=new Float32Array(an.fftSize);
    floor=.002;quiet=0;
    timer=setInterval(listen,50);micOn=true;return true;
  }catch(e){micOn=false;return false}
}
function stopMic(){
  clearInterval(timer);timer=null;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  micOn=false;heardMidi=null;clearHeard();
  if($('hear'))$('hear').textContent='';
  if($('meter'))$('meter').classList.add('hide');
}
function pitch(b,sr){
  const n=b.length,maxLag=Math.min(n-1,Math.floor(sr/60)),c=new Float32Array(maxLag+2);
  for(let l=0;l<=maxLag;l++){let s=0;for(let j=0;j<n-l;j++)s+=b[j]*b[j+l];c[l]=s}
  let d=0;while(d<maxLag&&c[d]>c[d+1])d++;
  let mv=-1;for(let i=d;i<=maxLag;i++)if(c[i]>mv)mv=c[i];
  if(mv<=0||mv/c[0]<.4)return -1;
  let mp=-1;
  for(let i=Math.max(d,1);i<maxLag;i++){if(c[i]>=.9*mv&&c[i]>=c[i-1]&&c[i]>=c[i+1]){mp=i;break}}
  if(mp<1)return -1;
  let T=mp;const x1=c[mp-1],x2=c[mp],x3=c[mp+1],a=(x1+x3-2*x2)/2,bb=(x3-x1)/2;
  if(a)T=T-bb/(2*a);
  return sr/T;
}
let floor=.002,quiet=0;
function thrNow(){return Math.max(.02/(store.sens||10),Math.min(floor*3,.03))}
function listen(){
  if(demoing||!an)return;
  an.getFloatTimeDomainData(buf);
  let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];
  const rms=Math.sqrt(s/buf.length),thr=thrNow();
  const mi=$('mi');if(mi){mi.style.width=Math.min(100,rms/thr*25)+'%';mi.className=rms>=thr?'on':''}
  /* el ruido de fondo baja rápido y sube muy despacio, así la cola de una nota no lo contamina */
  floor=rms<floor?Math.max(.0004,floor*.8+rms*.2):Math.min(.03,floor*1.004);
  if(rms<thr){
    lastPc=-1;stable=0;cand=-1;prevRms=rms;pend=0;heardMidi=null;showHeard(-1);
    quiet++;
    $('hear').textContent=quiet>120?'🎧 No te oigo: acerca el móvil al teclado, sube su volumen o la sensibilidad':'🎧 Escuchando…';
    return;
  }
  quiet=0;
  const onset=rms>prevRms*1.25;prevRms=rms;
  const f=pitch(buf,ac.sampleRate);
  const m=f>0?Math.round(69+12*Math.log2(f/440)):-1;
  const pc=m>=0?((m%12)+12)%12:-1;
  heardMidi=m>=0?m:null;showHeard(pc);
  $('hear').textContent=pc>=0?('🎧 Tocas: '+PCN[pc]+' · '+Math.round(f)+' Hz'):'🎧 …';
  if(onset)pend=3;
  if(pc===cand)stable++;else{cand=pc;stable=1}
  /* tras un golpe de tecla, se evalúa en cuanto hay una nota clara */
  if(pend>0){pend--;if(pend<=1&&pc>=0){pend=0;lastPc=pc;evalPc(pc)}return}
  /* si una nota anterior sigue sonando, basta con que la nueva se mantenga 2 lecturas */
  if(pc>=0&&stable>=(lastPc<0?3:2)&&pc!==lastPc){lastPc=pc;evalPc(pc)}
}

/* ---------- controles ---------- */
function setMode(m){
  mode=m;$('mTap').className=m==='tap'?'on':'sec';$('mMic').className=m==='mic'?'on':'sec';
  $('meter').classList.toggle('hide',m!=='mic');
}
$('mTap').onclick=()=>{stopMic();setMode('tap');$('warn').classList.add('hide')};
$('mMic').onclick=async()=>{
  const ok=await startMic();
  if(ok){setMode('mic');$('warn').classList.add('hide');$('hear').textContent='🎧 Escuchando…'}
  else{
    setMode('tap');
    $('warn').textContent='No se pudo usar el micrófono aquí (puede que no hayas dado permiso, o que esta vista lo bloquee). Abre la app en Chrome desde su dirección web y acepta el permiso, o sigue con el modo pantalla.';
    $('warn').classList.remove('hide');
  }
};
$('demo').onclick=demo;
$('reset').onclick=()=>{demoing=false;open(L)};
$('back').onclick=()=>{demoing=false;home()};
$('cont').onclick=()=>open(ALL[nextIdx()]);
$('oLab').onchange=e=>{store.lab=e.target.checked;save();if(L)drawStaff()};
$('oHint').onchange=e=>{store.hint=e.target.checked;save();if(L)mark()};
$('oFall').onchange=e=>{store.fall=e.target.checked;save();applyFall()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>showTab(b.dataset.t));
$('oSens').value=store.sens||10;
$('oSens').oninput=e=>{store.sens=+e.target.value;save()};
$('fs').onclick=()=>{
  try{
    const d=document,el=d.documentElement;
    if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}
    else{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}
  }catch(e){}
};

home();
</script>
